services:
  answer:
    ports: !reset []
    labels:
      # answer router
      - "traefik.enable=true"
      - "traefik.http.routers.answer.rule=Host(`192.168.1.2`)"
      - "traefik.http.routers.answer.entrypoints=http"
      # answer-secure router
      - "traefik.http.routers.answer-secure.rule=Host(`192.168.1.2`)"
      - "traefik.http.routers.answer-secure.entrypoints=https"
      - "traefik.http.routers.answer-secure.tls=true"
      # loadbalancer
      - "traefik.http.services.answer.loadbalancer.server.port=80"
      # middleware
      - "traefik.http.routers.answer.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # 本番ではtrueにする
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
